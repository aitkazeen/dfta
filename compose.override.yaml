# Локальная разработка. Этот файл Compose подхватывает сам,
# накладывая поверх compose.yaml. В продакшене его просто не будет.

services:
  worker:
    build:
      context: ./server
      target: build
    command: sh -c "npx prisma generate && npx tsx watch src/worker.ts"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - /app/node_modules
    environment:
      NODE_ENV: development

  api:
    build:
      context: ./server
      # Останавливаемся на первой стадии Dockerfile — там есть
      # tsx, typescript и остальные dev-зависимости.
      target: build
    # migrate deploy применяет уже существующие файлы миграций (prisma/migrations/),
    # ничего не генерирует сам — в отличие от db push, безопасен для повторных запусков
    # и не спорит с историей миграций.
    command: sh -c "npx prisma migrate deploy && npm run dev"
    volumes:
      # Код монтируем с хоста, чтобы правки подхватывались без пересборки.
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      # А node_modules оставляем контейнерные: пакеты внутри собраны
      # под Linux, и папка с твоего macOS/Windows их сломает.
      - /app/node_modules
    environment:
      NODE_ENV: development
