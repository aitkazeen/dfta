# Базовая конфигурация — то, как проект работает "по-боевому".
# Локальные удобства (hot reload) лежат в compose.override.yaml,
# который Docker подхватывает автоматически.

services:
  api:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      # Хост базы — "db", то есть имя сервиса ниже.
      # Внутри сети Compose сервисы находят друг друга по имени.
      # Написать здесь localhost нельзя: для контейнера api
      # localhost — это он сам, а не Postgres.
      DATABASE_URL: postgres://app:secret@db:5432/app
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      db:
        # Ждём, пока healthcheck базы позеленеет.
        # Без этого api стартует раньше готовности Postgres и падает.
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    ports:
      # Проброс наружу нужен только чтобы подключаться с хоста
      # (psql, DBeaver, TablePlus). Приложению он не требуется.
      - "5432:5432"
    volumes:
      # Именованный том — данные переживают пересоздание контейнера.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./server
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/app
      REDIS_URL: redis://redis:6379
      # ${VAR} — Compose подставляет значение из .env в корне репозитория
      # (не server/.env — тот читают только npm-скрипты вне Docker) или из
      # переменной окружения хоста. Без обоих ключей воркер просто не пишет
      # explanation/drivers (см. explainer.factory.ts) — не обязательны.
      # При обоих заданных выигрывает бесплатный Gemini.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Без него createNewsSources пропускает Marketaux и опрашивает только
      # НБ РК RSS (см. news/sources.factory.ts) — не обязателен, но без него
      # источник новостей всего один.
      MARKETAUXAPI_KEY: ${MARKETAUXAPI_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
